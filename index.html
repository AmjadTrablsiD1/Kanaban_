<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b23;
    --surface-2: #1f2330;
    --surface-3: #262b3a;
    --border: #2c3242;
    --text: #e8eaf0;
    --text-dim: #8b91a5;
    --accent: #6366f1;
    --danger: #f43f5e;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    --card-shadow: 0 6px 18px rgba(0,0,0,.4);
    --header-bg: rgba(15,17,23,.7);
    --chip-ring: #fff;
    --glass: rgba(24,27,35,.68);
    --glass-strong: rgba(15,17,23,.6);
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f6f7fa;
    --surface-3: #e9ecf2;
    --border: #dde2ea;
    --text: #1c2030;
    --text-dim: #6b7385;
    --shadow: 0 8px 24px rgba(30,40,70,.10);
    --card-shadow: 0 6px 18px rgba(30,40,70,.14);
    --header-bg: rgba(255,255,255,.72);
    --chip-ring: #1c2030;
    --glass: rgba(255,255,255,.74);
    --glass-strong: rgba(255,255,255,.66);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: background .35s, color .2s;
  }

  /* ---------- Wallpaper layers ---------- */
  #wallpaper {
    position: fixed; inset: 0; z-index: -2;
    background-size: cover; background-position: center;
    background-repeat: no-repeat;
    display: none;
    transform: scale(1.04); /* hides blur edges */
    transition: filter .25s ease;
  }
  #wallpaperTint {
    position: fixed; inset: 0; z-index: -1;
    display: none; pointer-events: none;
    transition: background .25s ease;
  }
  :root.has-wallpaper #wallpaper,
  :root.has-wallpaper #wallpaperTint { display: block; }

  /* over a wallpaper, panels turn to frosted glass */
  :root.has-wallpaper header { background: var(--glass-strong); }
  :root.has-wallpaper .column:not(.tinted) {
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
  }
  :root.has-wallpaper .card:not(.tinted) {
    background: var(--glass);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
    flex-wrap: wrap;
    position: relative;
    z-index: 20;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: grid; place-items: center;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(99,102,241,.4);
    flex-shrink: 0;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }

  /* ---------- Category bar (master categories) ---------- */
  #groupBar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    flex-shrink: 0; position: relative; z-index: 16;
  }
  #groupTabs {
    display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none;
    flex: 1; padding: 2px;
    scroll-behavior: smooth;
  }
  #groupTabs::-webkit-scrollbar { display: none; }
  .gtab {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 12.5px; font-weight: 700; font-family: inherit;
    letter-spacing: .2px;
    white-space: nowrap; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, transform .12s;
  }
  .gtab:hover { color: var(--text); transform: translateY(-1px); }
  .gtab.active {
    color: var(--text);
    background: var(--surface-3);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .gtab .gtab-ico { font-size: 13px; }
  /* a board tab is being dragged over this category */
  .gtab.drop-here {
    border-color: var(--accent);
    background: rgba(99,102,241,.18);
    color: var(--text);
    transform: scale(1.05);
  }
  .bar-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--text-dim);
    opacity: .65; flex-shrink: 0;
  }

  /* ---------- Project tabs ---------- */
  #projectBar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    flex-shrink: 0; position: relative; z-index: 15;
  }
  #projectTabs {
    display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none;
    flex: 1; padding: 2px;
    scroll-behavior: smooth;
  }
  #projectTabs::-webkit-scrollbar { display: none; }
  .ptab {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit;
    white-space: nowrap; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, transform .12s;
  }
  .ptab:hover { color: var(--text); transform: translateY(-1px); }
  .ptab.active {
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(99,102,241,.4);
  }
  .ptab .ptab-count {
    font-size: 11px; font-weight: 700;
    background: rgba(127,127,127,.22);
    border-radius: 10px; padding: 1px 7px;
  }
  .ptab.active .ptab-count { background: rgba(255,255,255,.25); }
  .ptab kbd {
    font-size: 10px; font-family: inherit; opacity: .6;
    border: 1px solid currentColor; border-radius: 4px;
    padding: 0 4px; line-height: 14px;
  }
  .ptab.tab-dragging { opacity: .4; transform: scale(.95); }

  /* a category with no boards yet */
  .board-empty {
    margin: 40px auto; text-align: center; max-width: 420px;
    color: var(--text-dim);
  }
  .board-empty .big { font-size: 42px; display: block; margin-bottom: 12px; }
  .board-empty h3 { font-size: 16px; color: var(--text); margin-bottom: 8px; }
  .board-empty p { font-size: 13.5px; line-height: 1.6; }

  .stats { font-size: 13px; color: var(--text-dim); }
  .spacer { flex: 1; }

  .hdr-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 9px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    font-size: 16px;
    cursor: pointer;
    transition: .15s;
    flex-shrink: 0;
  }
  .hdr-btn:hover { color: var(--text); border-color: var(--accent); }

  #saveStatus {
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
    transition: color .3s;
  }
  #saveStatus .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981; transition: background .3s;
  }
  #saveStatus.saving .dot { background: #f59e0b; }
  #saveStatus.error .dot { background: var(--danger); }

  /* ---------- Background popover ---------- */
  .popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 100;
    min-width: 210px;
  }
  .popover.open { display: block; }
  .popover h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--text-dim); margin-bottom: 10px;
  }
  .bg-option {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 9px;
    cursor: pointer; transition: background .12s;
    font-size: 13.5px; font-weight: 600;
  }
  .bg-option:hover { background: var(--surface-3); }
  .bg-option .swatch {
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .bg-option .check { margin-left: auto; color: var(--accent); visibility: hidden; }
  .bg-option.active .check { visibility: visible; }
  .popover .sep { height: 1px; background: var(--border); margin: 12px 0 10px; }
  .pop-btn {
    display: block; width: 100%;
    padding: 9px 10px; margin-top: 6px;
    border-radius: 9px; border: 1px dashed var(--border);
    background: none; color: var(--text-dim);
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: .15s; text-align: center;
  }
  .pop-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,.07); }
  .pop-btn.solid { border-style: solid; }
  .slider-row { margin-top: 12px; }
  .slider-row label {
    display: flex; justify-content: space-between;
    font-size: 11.5px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px;
  }
  .slider-row input[type=range] {
    width: 100%; accent-color: var(--accent); cursor: pointer;
  }
  #wpThumb {
    width: 100%; height: 62px; border-radius: 9px;
    background-size: cover; background-position: center;
    border: 1px solid var(--border); margin-top: 8px;
    display: none;
  }
  #wpThumb.show { display: block; }

  /* ---------- Board ---------- */
  #board {
    display: flex; gap: 18px;
    padding: 24px 28px;
    overflow-x: auto; overflow-y: hidden;
    flex: 1;
    align-items: flex-start;
  }
  #board::-webkit-scrollbar { height: 10px; }
  #board::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--col-color, var(--border));
    border-radius: var(--radius);
    width: 300px; min-width: 300px;
    max-height: 100%;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }

  .col-header {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 13px 10px;
    flex-shrink: 0;
    border-radius: calc(var(--radius) - 3px) calc(var(--radius) - 3px) 0 0;
  }
  .col-dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    cursor: pointer; transition: transform .12s;
    border: none;
    position: relative;
  }
  .col-dot:hover { transform: scale(1.3); }
  .col-dot input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
    border: none; padding: 0;
  }
  .col-fill {
    width: 18px; height: 18px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    cursor: pointer; position: relative; flex-shrink: 0;
    transition: transform .12s;
  }
  .col-fill:hover { transform: scale(1.15); }
  .col-fill input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
    border: none; padding: 0;
  }
  .col-title {
    font-weight: 700; font-size: 14px; letter-spacing: .4px;
    line-height: 1.3;
    flex: 1; cursor: text; border-radius: 6px; padding: 3px 6px;
    outline: none; min-width: 0;
    white-space: normal;       /* a long list name wraps instead of being cut off */
    overflow-wrap: break-word; /* only breaks inside a word when it cannot fit alone */
  }
  .col-title:focus { background: var(--surface-3); }
  .col-count {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: var(--surface-3); border-radius: 20px;
    padding: 2px 9px;
  }
  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; border-radius: 7px;
    width: 26px; height: 26px; display: grid; place-items: center;
    transition: .15s;
  }
  .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }

  .cards {
    padding: 6px 12px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 40px;
    flex: 1;
  }
  .cards::-webkit-scrollbar { width: 8px; }
  .cards::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--card-color, var(--accent));
    border-radius: 10px;
    padding: 12px 14px;
    cursor: grab;
    /* only compositor-friendly properties animate, so dragging stays smooth */
    transition: transform .13s cubic-bezier(.2,.8,.3,1), box-shadow .13s ease;
    will-change: transform;
    animation: pop .2s ease;
  }
  .card:hover {
    transform: translateY(-2px) scale(1.008);
    box-shadow: var(--card-shadow);
  }
  .card:active { cursor: grabbing; }
  .card.dragging {
    opacity: .4;
    transform: rotate(1.5deg) scale(.97);
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    transition: none;           /* never lag behind the cursor */
  }
  /* brief glow where a card just landed */
  @keyframes landed {
    from { box-shadow: 0 0 0 2px var(--accent), var(--card-shadow); transform: scale(1.03); }
    to   { box-shadow: 0 0 0 0 transparent; transform: scale(1); }
  }
  .card.landed { animation: landed .45s cubic-bezier(.2,.8,.3,1); }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.4; word-wrap: break-word; }
  .card-desc {
    font-size: 12.5px; color: var(--text-dim); margin-top: 6px;
    line-height: 1.45; word-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  .drop-indicator {
    height: 4px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    margin: -5px 4px;
    box-shadow: 0 0 10px var(--accent);
    animation: indicatorIn .12s ease;
  }
  @keyframes indicatorIn { from { opacity: 0; transform: scaleX(.7); } }
  .cards.drag-over-empty {
    outline: 2px dashed var(--accent);
    outline-offset: -6px;
    border-radius: 10px;
    background: rgba(99,102,241,.06);
  }
  /* the column you are hovering lifts slightly */
  .column.drag-target {
    border-color: var(--accent);
    box-shadow: 0 10px 34px rgba(99,102,241,.28), var(--shadow);
  }

  .add-card-btn {
    margin: 4px 12px 12px;
    padding: 9px;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: .15s;
    flex-shrink: 0;
  }
  .add-card-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,.07); }

  #addColumnBtn {
    min-width: 260px; width: 260px;
    padding: 16px;
    background: rgba(128,128,160,.04);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  #addColumnBtn:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,.06); }

  /* ---------- Version chip & update toast ---------- */
  #versionTag {
    font-size: 11.5px; font-weight: 700;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 11px;
    cursor: pointer; font-family: inherit;
    transition: .15s; white-space: nowrap;
  }
  #versionTag:hover { color: var(--text); border-color: var(--accent); }
  #versionTag.has-update {
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border-color: transparent;
    box-shadow: 0 3px 12px rgba(99,102,241,.45);
  }

  #updateToast {
    position: fixed; right: 22px; bottom: 22px;
    width: min(370px, calc(100vw - 44px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(0,0,0,.4);
    padding: 16px 18px;
    z-index: 200; display: none;
    animation: toastIn .25s ease;
  }
  #updateToast.open { display: block; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px); } }
  #updateToast .ut-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  #updateToast .ut-badge { font-size: 17px; }
  #updateToast h4 { font-size: 14.5px; font-weight: 700; }
  #updateToast p { font-size: 12.8px; color: var(--text-dim); line-height: 1.5; }
  #updateToast .ut-ver { font-size: 11.8px; color: var(--text-dim); margin-top: 6px; opacity: .85; }
  #updateToast .ut-actions { display: flex; gap: 8px; margin-top: 14px; }
  #updateToast .btn { padding: 8px 14px; font-size: 13px; }
  #updateToast pre {
    margin-top: 10px; padding: 9px 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 11.5px; color: var(--text-dim);
    max-height: 130px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- Global Done panel ---------- */
  #doneOverlay {
    position: fixed; inset: 0;
    background: rgba(5,6,10,.55);
    backdrop-filter: blur(4px);
    display: none; place-items: center;
    z-index: 60;
  }
  #doneOverlay.open { display: grid; }
  #donePanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: min(760px, calc(100vw - 40px));
    max-height: min(86vh, 900px);
    display: flex; flex-direction: column;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
    animation: modalIn .2s ease;
    overflow: hidden;
  }
  .done-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 20px 22px 0;
  }
  .done-head h2 { font-size: 17px; font-weight: 700; }
  .done-head p { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .done-scroll { overflow-y: auto; padding: 0 22px 22px; }
  .done-scroll::-webkit-scrollbar { width: 9px; }
  .done-scroll::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }

  .done-hero {
    text-align: center;
    padding: 18px 0 20px;
    margin: 16px 0 6px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(99,102,241,.13), rgba(168,85,247,.10));
    border: 1px solid var(--border);
  }
  .hero-num {
    font-size: 54px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--text-dim); margin-top: 7px;
  }
  .hero-stats {
    display: flex; justify-content: center; gap: 26px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .hero-stats div { font-size: 12.5px; color: var(--text-dim); }
  .hero-stats b { display: block; font-size: 18px; color: var(--text); font-weight: 700; }

  .done-project { margin-top: 20px; }
  .done-project-head {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 9px;
  }
  .done-project-head h3 { font-size: 13.5px; font-weight: 700; }
  .done-project-head .pill {
    font-size: 11.5px; font-weight: 700;
    background: var(--surface-3); color: var(--text-dim);
    border-radius: 20px; padding: 2px 9px;
  }
  .done-project-head .bar {
    flex: 1; height: 5px; border-radius: 3px;
    background: var(--surface-3); overflow: hidden;
  }
  .done-project-head .bar span {
    display: block; height: 100%;
    background: linear-gradient(90deg, #6366f1, #a855f7);
  }
  .done-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; margin-bottom: 7px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--dot, var(--accent));
    border-radius: 9px;
  }
  .done-item .check { color: #10b981; font-size: 13px; flex-shrink: 0; }
  .done-item .txt { flex: 1; min-width: 0; }
  .done-item .name { font-size: 13.5px; font-weight: 600; word-wrap: break-word; }
  .done-item .meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .done-item .when { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }

  .done-empty {
    text-align: center; padding: 30px 16px;
    color: var(--text-dim); font-size: 13.5px; line-height: 1.6;
  }
  .done-empty .big { font-size: 34px; display: block; margin-bottom: 10px; }

  #doneConfig {
    margin-top: 22px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  #doneConfig summary {
    font-size: 12.5px; font-weight: 600; color: var(--text-dim);
    cursor: pointer; list-style: none; user-select: none;
  }
  #doneConfig summary::-webkit-details-marker { display: none; }
  #doneConfig summary::before { content: "⚙  "; }
  #doneConfig summary:hover { color: var(--text); }
  .cfg-project { margin-top: 12px; }
  .cfg-project h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px;

  .cfg-row {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 8px; border-radius: 7px;
    font-size: 13px; cursor: pointer;
  }
  .cfg-row:hover { background: var(--surface-3); }
  .cfg-row input { accent-color: var(--accent); cursor: pointer; }
  .cfg-row .n { font-size: 11.5px; color: var(--text-dim); margin-left: auto; }

  .done-cat {
    font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(99,102,241,.14);
    border-radius: 6px; padding: 2px 7px;
    vertical-align: middle; margin-right: 2px;
  }

  /* ---------- Modal ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(5,6,10,.55);
    backdrop-filter: blur(4px);
    display: none; place-items: center;

  #overlay.open { display: grid; }
  #modal {
    background: var(--surface);

    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);

  }
  @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(10px); } }
  #modal h2 { font-size: 16px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .field input[type=text], .field textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px; font-family: inherit;
    outline: none; transition: border-color .15s;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 84px; }
  .color-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .color-chip {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;

  .color-chip:hover { transform: scale(1.15); }

  .color-chip.none {

    border: 2px solid var(--border);

  .color-chip.none.selected { border-color: var(--chip-ring); }
  .custom-color {

  .custom-color input {
    position: absolute; inset: 0;

  }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    padding: 10px 18px; border-radius: 9px;
    border: none; font-size: 14px; font-weight: 600;

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5558e8; box-shadow: 0 4px 14px rgba(99,102,241,.4); }

  .btn-danger:hover { background: rgba(244,63,94,.12); }
</style>

<body>

<div id="wallpaper"></div>
<div id="wallpaperTint"></div>

<header>
  <div class="logo">📋</div>
  <h1>Kanban</h1>
  <span class="stats" id="stats"></span>
  <div class="spacer"></div>
  <button class="hdr-btn" id="btnDone" title="Everything you've completed">🏆</button>
  <button class="hdr-btn" id="btnBg" title="Background & wallpaper">🎨</button>
  <button class="hdr-btn" id="btnTheme" title="Dark / light mode">🌙</button>
  <button id="versionTag" title="Check for updates">v…</button>
  <div id="saveStatus"><span class="dot"></span><span id="saveText">Saved</span></div>
  <div class="popover" id="bgPopover">
    <h3>Background</h3>

    <button class="pop-btn" id="btnClearWallpaper" style="display:none">Remove wallpaper</button>

<nav id="groupBar">

<div id="board"></div>

<div id="doneOverlay">
  <div id="donePanel">
    <div class="done-head">
      <div style="flex:1">
        <h2>🏆 Everything you've completed</h2>

      <label>Accent color (left bar)</label>

      <button class="btn btn-danger" id="btnDelete">Delete</button>
      <button class="btn btn-ghost" id="btnCancel">Cancel</button>
      <button class="btn btn-primary" id="btnSave">Save</button>
    </div>
  </div>
</div>

<script>
"use strict";

const CARD_COLORS = ["#6366f1", "#0ea5e9", "#10b981", "#f59e0b", "#f43f5e", "#a855f7", "#8b91a5"];
const COL_COLORS  = ["#f43f5e", "#f59e0b", "#10b981", "#0ea5e9", "#a855f7", "#6366f1"];

const BACKGROUNDS = {
  indigo: {
    label: "Indigo Night",
    dark:  "radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(244,63,94,.10), transparent 60%), #0f1117",
    light: "radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(244,63,94,.10), transparent 60%), #eef1f6",
  },
  ocean: {
    label: "Ocean",
    dark:  "radial-gradient(1100px 600px at 75% -10%, rgba(14,165,233,.18), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(16,185,129,.12), transparent 60%), #0c1219",
    light: "radial-gradient(1100px 600px at 75% -10%, rgba(14,165,233,.20), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(16,185,129,.14), transparent 60%), #edf4f8",
  },
  sunset: {
    label: "Sunset",
    dark:  "radial-gradient(1100px 600px at 80% -10%, rgba(244,63,94,.16), transparent 60%), radial-gradient(900px 500px at -5% 110%, rgba(245,158,11,.13), transparent 60%), #14100f",
    light: "radial-gradient(1100px 600px at 80% -10%, rgba(244,63,94,.14), transparent 60%), radial-gradient(900px 500px at -5% 110%, rgba(245,158,11,.16), transparent 60%), #f8f0ec",
  },
  forest: {
    label: "Forest",
    dark:  "radial-gradient(1100px 600px at 80% -10%, rgba(16,185,129,.15), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(132,204,22,.10), transparent 60%), #0e1412",
    light: "radial-gradient(1100px 600px at 80% -10%, rgba(16,185,129,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(132,204,22,.12), transparent 60%), #eef4ef",
  },
  violet: {
    label: "Violet",
    dark:  "radial-gradient(1100px 600px at 75% -10%, rgba(168,85,247,.18), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(99,102,241,.12), transparent 60%), #120f17",
    light: "radial-gradient(1100px 600px at 75% -10%, rgba(168,85,247,.15), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(99,102,241,.12), transparent 60%), #f3eff8",
  },
  plain: {
    label: "Plain",
    dark:  "#0f1117",
    light: "#eef1f6",
  },
};

let data = null;             // { settings, activeProject, projects }
let editing = null;          // { colId, cardId } or { colId, cardId: null }
let selectedColor = CARD_COLORS[0];
let selectedBg = null;       // null = default card background
let drag = null;             // { cardId, fromColId }

const CARD_BG_PRESETS = ["#fde68a", "#bbf7d0", "#bfdbfe", "#fbcfe8", "#475569", "#7c3aed"];

const $ = (sel) => document.querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

// readable text colors for any custom background
function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return lum > 150
    ? { text: "#1c2030", dim: "rgba(28,32,48,.65)" }
    : { text: "#f0f2f7", dim: "rgba(240,242,247,.68)" };
}

function group() {
  return data.groups.find((g) => g.id === data.activeGroup) || data.groups[0];
}

/* the boards filed under a category */
function groupProjects(gid) {
  const id = gid || (group() && group().id);
  return data.projects.filter((p) => p.groupId === id);
}

function project() {
  return data.projects.find((p) => p.id === data.activeProject) || groupProjects()[0];
}

/* mirrors the migration on the server, so an old file works even offline */
function migrateClient(d) {
  if (!d.settings) d.settings = { theme: "dark", background: "indigo" };
  if (d.columns && !d.projects) {
    d.projects = [{ id: uid(), name: "My Project", columns: d.columns }];
    delete d.columns;
  }
  if (!d.projects) d.projects = [];
  if (!d.groups || !d.groups.length) d.groups = [{ id: "g1", name: "My Boards" }];
  const known = new Set(d.groups.map((g) => g.id));
  for (const p of d.projects) if (!known.has(p.groupId)) p.groupId = d.groups[0].id;
  if (!known.has(d.activeGroup)) d.activeGroup = d.groups[0].id;
  if (!d.projects.some((p) => p.id === d.activeProject)) {
    const first = d.projects.find((p) => p.groupId === d.activeGroup) || d.projects[0];
    d.activeProject = first ? first.id : null;
  }
  return d;
}

// A column counts as "done" if you ticked it, otherwise if it is named like one.
const DONE_NAMES = ["done", "completed", "complete", "finished",
                    "fertig", "erledigt", "abgeschlossen"];
function isDoneColumn(col) {
  if (typeof col.done === "boolean") return col.done;
  return DONE_NAMES.includes((col.title || "").trim().toLowerCase());
}
function defaultColumns() {
  return [
    { id: uid(), title: "To Do",  color: "#f43f5e", cards: [] },
    { id: uid(), title: "Doing",  color: "#f59e0b", cards: [] },
    { id: uid(), title: "Done",   color: "#10b981", cards: [] },
  ];
}

/* ---------- persistence ---------- */

let saveTimer = null;
function scheduleSave() {
  setStatus("saving", "Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
async function saveNow() {
  try {
    const res = await fetch("/api/board", { method: "POST", body: JSON.stringify(data) });
    if (!res.ok) throw new Error();
    setStatus("", "Saved");
  } catch {
    setStatus("error", "Save failed — is the server running?");
  }
}
function setStatus(cls, text) {
  $("#saveStatus").className = cls;
  $("#saveText").textContent = text;
}

async function loadData() {
  try {
    data = await (await fetch("/api/board")).json();
  } catch {
    setStatus("error", "Could not load board");
    data = { settings: { theme: "dark", background: "indigo" },
             activeGroup: "g1", activeProject: "p1",
             groups: [{ id: "g1", name: "My Boards" }],
             projects: [{ id: "p1", groupId: "g1", name: "My Project", columns: defaultColumns() }] };
  }
  migrateClient(data);
  applyTheme();
  renderGroups();
  renderProjects();
  render();
}

/* ---------- theme & background ---------- */

function applyTheme() {
  const theme = data.settings.theme === "light" ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  const bg = BACKGROUNDS[data.settings.background] || BACKGROUNDS.indigo;
  document.body.style.background = bg[theme];
  $("#btnTheme").textContent = theme === "dark" ? "🌙" : "☀️";
  applyWallpaper();
}

/* ---------- wallpaper ---------- */

function applyWallpaper() {
  const s = data.settings;
  const on = !!s.wallpaper;
  document.documentElement.classList.toggle("has-wallpaper", on);
  if (!on) return;

  // cache-buster so a freshly uploaded image shows up immediately
  $("#wallpaper").style.backgroundImage = `url("/wallpaper?v=${s.wallpaper}")`;
  $("#wallpaper").style.filter = s.wpBlur ? `blur(${s.wpBlur}px)` : "none";

  const dim = (s.wpDim ?? 35) / 100;
  const dark = data.settings.theme !== "light";
  $("#wallpaperTint").style.background = dark
    ? `rgba(8,10,15,${dim})`
    : `rgba(255,255,255,${dim})`;
}

function syncWallpaperControls() {
  const s = data.settings;
  const on = !!s.wallpaper;
  $("#wpControls").style.display = on ? "" : "none";
  $("#btnClearWallpaper").style.display = on ? "" : "none";
  $("#wpThumb").classList.toggle("show", on);
  if (on) $("#wpThumb").style.backgroundImage = `url("/wallpaper?v=${s.wallpaper}")`;
  $("#wpDim").value = s.wpDim ?? 35;
  $("#wpBlur").value = s.wpBlur ?? 0;
  $("#wpDimVal").textContent = `${s.wpDim ?? 35}%`;
  $("#wpBlurVal").textContent = `${s.wpBlur ?? 0}px`;
}

$("#btnPickWallpaper").addEventListener("click", () => $("#wpFile").click());

$("#wpFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("#btnPickWallpaper").textContent = "Uploading…";
  try {
    const res = await fetch("/api/wallpaper", {
      method: "POST",
      headers: { "Content-Type": file.type },
      body: file,
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "upload failed");
    data.settings.wallpaper = Date.now();      // doubles as the cache-buster
    if (data.settings.wpDim === undefined) data.settings.wpDim = 35;
    if (data.settings.wpBlur === undefined) data.settings.wpBlur = 0;
    applyWallpaper();
    syncWallpaperControls();
    scheduleSave();
  } catch (err) {
    alert("Could not set that wallpaper.\n" + err.message);
  }
  $("#btnPickWallpaper").textContent = "Choose an image…";
  e.target.value = "";
});

$("#btnClearWallpaper").addEventListener("click", () => {
  delete data.settings.wallpaper;
  applyWallpaper();
  syncWallpaperControls();
  scheduleSave();
});

$("#wpDim").addEventListener("input", (e) => {
  data.settings.wpDim = Number(e.target.value);
  $("#wpDimVal").textContent = `${e.target.value}%`;
  applyWallpaper();
  scheduleSave();
});

$("#wpBlur").addEventListener("input", (e) => {
  data.settings.wpBlur = Number(e.target.value);
  $("#wpBlurVal").textContent = `${e.target.value}px`;
  applyWallpaper();
  scheduleSave();
});

$("#btnTheme").addEventListener("click", () => {
  data.settings.theme = data.settings.theme === "light" ? "dark" : "light";
  applyTheme();
  buildBgOptions();
  scheduleSave();
});

function buildBgOptions() {
  const wrap = $("#bgOptions");
  wrap.innerHTML = "";
  const theme = data.settings.theme === "light" ? "light" : "dark";
  for (const [key, bg] of Object.entries(BACKGROUNDS)) {
    const opt = document.createElement("div");
    opt.className = "bg-option" + (data.settings.background === key ? " active" : "");
    opt.innerHTML = `<span class="swatch" style="background:${bg[theme]}"></span><span>${bg.label}</span><span class="check">✓</span>`;
    opt.addEventListener("click", () => {
      data.settings.background = key;
      applyTheme();
      buildBgOptions();
      scheduleSave();
    });
    wrap.appendChild(opt);
  }
}

$("#btnBg").addEventListener("click", (e) => {
  e.stopPropagation();
  buildBgOptions();
  syncWallpaperControls();
  $("#bgPopover").classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!$("#bgPopover").contains(e.target) && e.target.id !== "btnBg") {
    $("#bgPopover").classList.remove("open");
  }
});

/* ---------- projects ---------- */

/* ---------- categories ---------- */

let tabDrag = null;   // id of the board tab being dragged onto a category

function renderGroups() {
  const bar = $("#groupTabs");
  bar.innerHTML = "";
  data.groups.forEach((g, i) => {
    const boards = groupProjects(g.id);
    const tasks = boards.reduce((n, p) =>
      n + p.columns.reduce((m, c) => m + c.cards.length, 0), 0);
    const tab = document.createElement("button");
    tab.className = "gtab" + (g.id === data.activeGroup ? " active" : "");
    tab.dataset.groupId = g.id;
    tab.innerHTML = `<span class="gtab-ico">📁</span>` +
      `${i < 9 ? `<kbd>⇧${i + 1}</kbd>` : ""}<span>${esc(g.name)}</span>` +
      `<span class="ptab-count">${boards.length}</span>`;
    tab.title = `${boards.length} board${boards.length === 1 ? "" : "s"}, ${tasks} task${tasks === 1 ? "" : "s"}` +
      `\nDrop a board here to move it into this category`;
    tab.addEventListener("click", () => switchGroup(g.id));

    // dropping a board tab here re-files that board
    tab.addEventListener("dragover", (e) => {
      if (!tabDrag) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      tab.classList.add("drop-here");
    });
    tab.addEventListener("dragleave", () => tab.classList.remove("drop-here"));
    tab.addEventListener("drop", (e) => {
      if (!tabDrag) return;
      e.preventDefault();
      tab.classList.remove("drop-here");
      moveProjectToGroup(tabDrag, g.id);
    });
    bar.appendChild(tab);
  });
  const active = bar.querySelector(".gtab.active");
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function switchGroup(id) {
  const target = data.groups.find((g) => g.id === id);
  if (!target || id === data.activeGroup) return;
  const current = group();
  if (current) current.lastProject = data.activeProject;   // come back where you left
  data.activeGroup = id;
  const boards = groupProjects(id);
  const want = boards.find((p) => p.id === target.lastProject) || boards[0];
  data.activeProject = want ? want.id : null;
  scheduleSave();
  renderGroups(); renderProjects(); render();
}

function stepGroup(delta) {
  const i = data.groups.findIndex((g) => g.id === data.activeGroup);
  const next = data.groups[(i + delta + data.groups.length) % data.groups.length];
  if (next) switchGroup(next.id);
}

function moveProjectToGroup(projectId, groupId) {
  const p = data.projects.find((x) => x.id === projectId);
  const g = data.groups.find((x) => x.id === groupId);
  if (!p || !g || p.groupId === groupId) return;
  p.groupId = groupId;
  // follow the board into its new home so it stays visible
  data.activeGroup = groupId;
  data.activeProject = p.id;
  scheduleSave();
  renderGroups(); renderProjects(); render();
}

$("#btnNewGroup").addEventListener("click", () => {
  const name = prompt("New category name (e.g. Software):", "");
  if (!name || !name.trim()) return;
  const g = { id: uid(), name: name.trim() };
  data.groups.push(g);
  data.activeGroup = g.id;
  data.activeProject = null;
  scheduleSave();
  renderGroups(); renderProjects(); render();
});

$("#btnRenameGroup").addEventListener("click", () => {
  const g = group();
  if (!g) return;
  const name = prompt("Rename category:", g.name);
  if (!name || !name.trim()) return;
  g.name = name.trim();
  scheduleSave();
  renderGroups();
});

$("#btnDeleteGroup").addEventListener("click", () => {
  if (data.groups.length <= 1) {
    alert("You need at least one category. Create another one first.");
    return;
  }
  const g = group();
  const boards = groupProjects(g.id);
  const msg = boards.length
    ? `Delete the category "${g.name}" and the ${boards.length} board(s) inside it?\n\n` +
      boards.map((b) => "• " + b.name).join("\n") +
      `\n\nEvery task on those boards is deleted too. This cannot be undone.`
    : `Delete the empty category "${g.name}"?`;
  if (!confirm(msg)) return;
  data.projects = data.projects.filter((p) => p.groupId !== g.id);
  data.groups = data.groups.filter((x) => x.id !== g.id);
  data.activeGroup = data.groups[0].id;
  const first = groupProjects(data.activeGroup)[0];
  data.activeProject = first ? first.id : null;
  scheduleSave();
  renderGroups(); renderProjects(); render();
});

$("#btnMoveProject").addEventListener("click", () => {
  const p = project();
  if (!p) { alert("There is no board to move."); return; }
  if (data.groups.length <= 1) {
    alert("There is only one category. Create another one first, then move boards into it.");
    return;
  }
  const list = data.groups
    .map((g, i) => `${i + 1}. ${g.name}${g.id === p.groupId ? "  (current)" : ""}`)
    .join("\n");
  const answer = prompt(`Move the board "${p.name}" to which category?\n\n${list}\n\nType a number:`, "");
  if (answer === null) return;
  const idx = Number(answer.trim()) - 1;
  if (!Number.isInteger(idx) || idx < 0 || idx >= data.groups.length) {
    alert("That is not one of the numbers in the list.");
    return;
  }
  moveProjectToGroup(p.id, data.groups[idx].id);
});

/* ---------- boards inside the current category ---------- */

function renderProjects() {
  const tabs = $("#projectTabs");
  tabs.innerHTML = "";
  groupProjects().forEach((p, i) => {
    const count = p.columns.reduce((n, c) => n + c.cards.length, 0);
    const tab = document.createElement("button");
    tab.className = "ptab" + (p.id === data.activeProject ? " active" : "");
    tab.dataset.projectId = p.id;
    tab.innerHTML = `${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}<span>${esc(p.name)}</span>` +
      `<span class="ptab-count">${count}</span>`;
    tab.addEventListener("click", () => switchProject(p.id));

    tab.draggable = true;
    tab.addEventListener("dragstart", (e) => {
      tabDrag = p.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", p.id);  // Firefox needs some payload
      tab.classList.add("tab-dragging");
    });
    tab.addEventListener("dragend", () => {
      tabDrag = null;
      tab.classList.remove("tab-dragging");
      document.querySelectorAll(".gtab.drop-here")
        .forEach((n) => n.classList.remove("drop-here"));
    });
    tabs.appendChild(tab);
  });
  const active = tabs.querySelector(".ptab.active");
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function switchProject(id) {
  if (!id || id === data.activeProject) return;
  data.activeProject = id;
  scheduleSave();
  renderProjects();
  render();
}

function stepProject(delta) {
  const boards = groupProjects();
  if (!boards.length) return;
  const i = boards.findIndex((p) => p.id === data.activeProject);
  const next = boards[(i + delta + boards.length) % boards.length];
  if (next) switchProject(next.id);
}

$("#btnNewProject").addEventListener("click", () => {
  const name = prompt("New project name:", "");
  if (!name || !name.trim()) return;
  const p = { id: uid(), groupId: data.activeGroup, name: name.trim(),
              columns: defaultColumns() };
  data.projects.push(p);
  data.activeProject = p.id;
  scheduleSave();
  renderGroups();
  renderProjects();
  render();
});

$("#btnRenameProject").addEventListener("click", () => {
  const p = project();
  const name = prompt("Rename project:", p.name);
  if (!name || !name.trim()) return;
  p.name = name.trim();
  scheduleSave();
  renderProjects();
});

$("#btnDeleteProject").addEventListener("click", () => {
  const p = project();
  if (!p) return;
  if (data.projects.length <= 1) {
    alert("You need at least one board. Create another board first.");
    return;
  }
  const total = p.columns.reduce((n, c) => n + c.cards.length, 0);
  if (!confirm(`Delete the board "${p.name}"${total ? ` and its ${total} task(s)` : ""}? This cannot be undone.`)) return;
  data.projects = data.projects.filter((x) => x.id !== p.id);
  const left = groupProjects();
  data.activeProject = left.length ? left[0].id : null;
  scheduleSave();
  renderGroups();
  renderProjects();
  render();
});

/* ---------- rendering ---------- */

function render() {
  const board = project();
  const boardEl = $("#board");
  boardEl.innerHTML = "";

  if (!board) {   // a category with no boards in it yet
    const g = group();
    boardEl.innerHTML = `<div class="board-empty">
      <span class="big">🗂️</span>
      <h3>“${esc(g ? g.name : "This category")}” has no boards yet</h3>
      <p>Use <b>＋</b> in the Boards row to create one here, or drag an existing
      board tab onto this category to move it in.</p>
    </div>`;
    updateStats();
    return;
  }

  for (const col of board.columns) {
    const colEl = document.createElement("div");
    colEl.className = "column";
    colEl.dataset.colId = col.id;
    const safeColor = /^#[0-9a-fA-F]{6}$/.test(col.color) ? col.color : "#6366f1";
    const theme = data.settings.theme === "light" ? "light" : "dark";
    const fillValue = /^#[0-9a-fA-F]{6}$/.test(col.bg || "") ? col.bg
      : (theme === "light" ? "#ffffff" : "#181b23");
    colEl.innerHTML = `
      <div class="col-header">
        <label class="col-dot" title="Accent color (top bar & dot)">
          <input type="color" value="${safeColor}">
        </label>
        <div class="col-title" contenteditable="true" spellcheck="false">${esc(col.title)}</div>
        <span class="col-count">${col.cards.length}</span>
        <label class="col-fill" title="List background color">
          <input type="color" value="${fillValue}">
        </label>
        <button class="icon-btn" data-reset title="Reset list background">↺</button>
        <button class="icon-btn danger" title="Delete column">✕</button>
      </div>
      <div class="cards"></div>
      <button class="add-card-btn">＋ Add task</button>
    `;

    const paintColumn = () => {
      colEl.style.setProperty("--col-color", col.color);
      const dot = colEl.querySelector(".col-dot");
      dot.style.background = col.color;
      dot.style.boxShadow = `0 0 8px ${col.color}`;
      colEl.querySelector(".col-header").style.background =
        `linear-gradient(180deg, ${col.color}1f, transparent)`;
      colEl.querySelector("[data-reset]").style.display = col.bg ? "" : "none";
      if (col.bg) {
        const t = textColorFor(col.bg);
        colEl.style.background = col.bg;
        colEl.querySelector(".col-fill").style.background = col.bg;
        colEl.querySelector(".col-title").style.color = t.text;
        const count = colEl.querySelector(".col-count");
        count.style.color = t.dim;
        count.style.background = "rgba(127,127,127,.25)";
        colEl.querySelector(".add-card-btn").style.color = t.dim;
        colEl.querySelectorAll(".icon-btn").forEach((b) => { b.style.color = t.dim; });
      }
    };
    paintColumn();

    // live color pickers: update while dragging in the picker, auto-save
    colEl.querySelector(".col-dot input").addEventListener("input", (e) => {
      col.color = e.target.value;
      paintColumn();
      scheduleSave();
    });
    colEl.querySelector(".col-fill input").addEventListener("input", (e) => {
      col.bg = e.target.value;
      paintColumn();
      scheduleSave();
    });
    colEl.querySelector("[data-reset]").addEventListener("click", () => {
      delete col.bg;
      scheduleSave(); render();
    });

    const titleEl = colEl.querySelector(".col-title");
    titleEl.addEventListener("blur", () => {
      const t = titleEl.textContent.trim();
      if (t && t !== col.title) { col.title = t; scheduleSave(); }
      titleEl.textContent = col.title;
    });
    titleEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); } });

    colEl.querySelector(".icon-btn.danger").addEventListener("click", () => {
      const msg = col.cards.length
        ? `Delete "${col.title}" and its ${col.cards.length} task(s)?`
        : `Delete column "${col.title}"?`;
      if (confirm(msg)) {
        board.columns = board.columns.filter((c) => c.id !== col.id);
        scheduleSave(); render();
      }
    });

    colEl.querySelector(".add-card-btn").addEventListener("click", () => openModal(col.id, null));

    if (col.bg) colEl.classList.add("tinted");  // keep the glass effect off custom colors

    const cardsEl = colEl.querySelector(".cards");
    const frag = document.createDocumentFragment();
    for (const card of col.cards) frag.appendChild(renderCard(card));
    cardsEl.appendChild(frag);

    boardEl.appendChild(colEl);
  }

  const addCol = document.createElement("button");
  addCol.id = "addColumnBtn";
  addCol.textContent = "＋ Add column";
  addCol.addEventListener("click", () => {
    const title = prompt("Column name:", "New column");
    if (!title || !title.trim()) return;
    board.columns.push({
      id: uid(),
      title: title.trim(),
      color: COL_COLORS[board.columns.length % COL_COLORS.length],
      cards: [],
    });
    scheduleSave(); render();
  });
  boardEl.appendChild(addCol);

  updateStats();
}

/* Cheap refresh after a drag: counts only, no DOM rebuild. */
function updateStats() {
  const board = project();
  if (!board) { $("#stats").textContent = ""; return; }
  const total = board.columns.reduce((n, c) => n + c.cards.length, 0);
  const doneCols = board.columns.filter(isDoneColumn);
  const doneCount = doneCols.reduce((n, c) => n + c.cards.length, 0);
  $("#stats").textContent = total
    ? `${total} task${total === 1 ? "" : "s"}${doneCols.length ? ` · ${doneCount} done` : ""}`
    : "";
  for (const col of board.columns) {
    const el = $("#board").querySelector(`.column[data-col-id="${cssId(col.id)}"] .col-count`);
    if (el) el.textContent = col.cards.length;
  }
  const tab = $("#projectTabs").querySelector(".ptab.active .ptab-count");
  if (tab) tab.textContent = total;
}

const cssId = (v) => (window.CSS && CSS.escape ? CSS.escape(v) : v);

function renderCard(card) {
  const el = document.createElement("div");
  el.className = "card" + (card.bg ? " tinted" : "");
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.style.setProperty("--card-color", card.color || CARD_COLORS[0]);
  el.innerHTML = `<div class="card-title">${esc(card.title)}</div>` +
    (card.desc ? `<div class="card-desc">${esc(card.desc)}</div>` : "");
  if (card.bg) {
    const t = textColorFor(card.bg);
    el.style.background = card.bg;
    el.querySelector(".card-title").style.color = t.text;
    const desc = el.querySelector(".card-desc");
    if (desc) desc.style.color = t.dim;
  }
  return el;  // no per-card listeners — the board handles events for all of them
}

/* ---------- drag & drop ----------
   All events are delegated to #board, the drop marker is a single reused
   node, and dropping moves the existing element instead of re-rendering. */

const boardEl = $("#board");
let dragEl = null;          // the card element being dragged
let dropMarker = null;      // one indicator, reused for the whole session
let markerParent = null;    // where the marker currently sits
let markerBefore = null;    // the card it is inserted before (null = at the end)
let hoverColumn = null;
let pointerY = 0;
let dragFrame = 0;

function marker() {
  if (!dropMarker) {
    dropMarker = document.createElement("div");
    dropMarker.className = "drop-indicator";
  }
  return dropMarker;
}

function clearDropHints() {
  if (dropMarker && dropMarker.parentNode) dropMarker.remove();
  markerParent = markerBefore = null;
  if (hoverColumn) {
    hoverColumn.classList.remove("drag-target");
    const zone = hoverColumn.querySelector(".cards");
    if (zone) zone.classList.remove("drag-over-empty");
    hoverColumn = null;
  }
}

/* Which card should the dragged one land in front of? (null = at the end) */
function findInsertBefore(cardsEl, y) {
  const nodes = cardsEl.children;
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    if (node === dragEl || node === dropMarker || !node.classList.contains("card")) continue;
    const rect = node.getBoundingClientRect();  // read only, no writes in between
    if (y < rect.top + rect.height / 2) return node;
  }
  return null;
}

function placeMarker(cardsEl) {
  const before = findInsertBefore(cardsEl, pointerY);
  if (markerParent === cardsEl && markerBefore === before) return;  // nothing moved
  markerParent = cardsEl;
  markerBefore = before;
  if (before) cardsEl.insertBefore(marker(), before);
  else cardsEl.appendChild(marker());
}

boardEl.addEventListener("dragstart", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragEl = card;
  drag = { cardId: card.dataset.cardId, fromColId: card.closest(".column").dataset.colId };
  e.dataTransfer.effectAllowed = "move";
  requestAnimationFrame(() => card.classList.add("dragging"));
});

boardEl.addEventListener("dragover", (e) => {
  if (!drag) return;
  const cardsEl = e.target.closest(".cards");
  if (!cardsEl) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  pointerY = e.clientY;

  const colEl = cardsEl.closest(".column");
  const enteredNewColumn = hoverColumn !== colEl;
  if (enteredNewColumn) {
    if (hoverColumn) {
      hoverColumn.classList.remove("drag-target");
      hoverColumn.querySelector(".cards").classList.remove("drag-over-empty");
    }
    hoverColumn = colEl;
    colEl.classList.add("drag-target");
  }
  const empty = !cardsEl.querySelector(".card:not(.dragging)");
  cardsEl.classList.toggle("drag-over-empty", empty);

  // show the marker at once when entering a column, then coalesce the
  // many small movements inside it into one update per animation frame
  if (enteredNewColumn) {
    if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
    placeMarker(cardsEl);
    return;
  }
  if (dragFrame) return;
  dragFrame = requestAnimationFrame(() => {
    dragFrame = 0;
    if (drag) placeMarker(cardsEl);
  });
});

boardEl.addEventListener("drop", (e) => {
  if (!drag) return;
  const cardsEl = e.target.closest(".cards");
  if (!cardsEl) return;
  e.preventDefault();
  if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }

  const board = project();
  const toCol = board.columns.find((c) => c.id === cardsEl.closest(".column").dataset.colId);
  const fromCol = board.columns.find((c) => c.id === drag.fromColId);
  if (!toCol || !fromCol) { clearDropHints(); return; }

  // work the position out from the pointer, so a very fast drop is still exact
  const beforeNode = findInsertBefore(cardsEl, e.clientY);
  const beforeId = beforeNode ? beforeNode.dataset.cardId : null;
  const fromIdx = fromCol.cards.findIndex((c) => c.id === drag.cardId);
  if (fromIdx < 0) { clearDropHints(); return; }
  const [card] = fromCol.cards.splice(fromIdx, 1);

  let index = beforeId ? toCol.cards.findIndex((c) => c.id === beforeId) : toCol.cards.length;
  if (index < 0) index = toCol.cards.length;
  toCol.cards.splice(index, 0, card);

  // remember when something was actually finished (or un-finished)
  if (isDoneColumn(toCol)) {
    if (!card.doneAt) card.doneAt = new Date().toISOString();
  } else {
    delete card.doneAt;
  }

  // move the element we already have instead of rebuilding the board
  const node = dragEl;
  if (beforeNode) cardsEl.insertBefore(node, beforeNode);
  else cardsEl.appendChild(node);

  clearDropHints();
  node.classList.remove("dragging");
  node.classList.add("landed");
  setTimeout(() => node.classList.remove("landed"), 460);
  dragEl = null;
  drag = null;

  updateStats();
  scheduleSave();
});

boardEl.addEventListener("dragend", () => {
  if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
  if (dragEl) dragEl.classList.remove("dragging");
  dragEl = null;
  drag = null;
  clearDropHints();
});

boardEl.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  openModal(card.closest(".column").dataset.colId, card.dataset.cardId);
});

/* ---------- modal ---------- */

function buildColorRow() {
  const row = $("#colorRow");
  row.innerHTML = "";
  const isPreset = CARD_COLORS.includes(selectedColor);
  for (const c of CARD_COLORS) {
    const chip = document.createElement("div");
    chip.className = "color-chip" + (c === selectedColor ? " selected" : "");
    chip.style.background = c;
    chip.title = c;
    chip.addEventListener("click", () => { selectedColor = c; buildColorRow(); });
    row.appendChild(chip);
  }
  // free color picker for any custom color
  const custom = document.createElement("div");
  custom.className = "custom-color" + (isPreset ? "" : " selected");
  custom.title = "Custom color";
  if (!isPreset) custom.style.background = selectedColor;
  const inp = document.createElement("input");
  inp.type = "color";
  inp.value = /^#[0-9a-fA-F]{6}$/.test(selectedColor) ? selectedColor : "#6366f1";
  inp.addEventListener("input", () => { selectedColor = inp.value; buildColorRow(); });
  custom.appendChild(inp);
  row.appendChild(custom);
}

function buildBgRow() {
  const row = $("#bgRow");
  row.innerHTML = "";

  // "default" = follow the theme's normal card background
  const none = document.createElement("div");
  none.className = "color-chip none" + (selectedBg === null ? " selected" : "");
  none.textContent = "∅";
  none.title = "Default background";
  none.addEventListener("click", () => { selectedBg = null; buildBgRow(); });
  row.appendChild(none);

  for (const c of CARD_BG_PRESETS) {
    const chip = document.createElement("div");
    chip.className = "color-chip" + (c === selectedBg ? " selected" : "");
    chip.style.background = c;
    chip.title = c;
    chip.addEventListener("click", () => { selectedBg = c; buildBgRow(); });
    row.appendChild(chip);
  }

  const isPreset = selectedBg === null || CARD_BG_PRESETS.includes(selectedBg);
  const custom = document.createElement("div");
  custom.className = "custom-color" + (isPreset ? "" : " selected");
  custom.title = "Custom background";
  if (!isPreset) custom.style.background = selectedBg;
  const inp = document.createElement("input");
  inp.type = "color";
  inp.value = /^#[0-9a-fA-F]{6}$/.test(selectedBg || "") ? selectedBg : "#fde68a";
  inp.addEventListener("input", () => { selectedBg = inp.value; buildBgRow(); });
  custom.appendChild(inp);
  row.appendChild(custom);
}

function openModal(colId, cardId) {
  editing = { colId, cardId };
  const col = project().columns.find((c) => c.id === colId);
  const card = cardId ? col.cards.find((c) => c.id === cardId) : null;

  $("#modalTitle").textContent = card ? "Edit Task" : `New Task — ${col.title}`;
  $("#inpTitle").value = card ? card.title : "";
  $("#inpDesc").value = card ? (card.desc || "") : "";
  selectedColor = card ? (card.color || CARD_COLORS[0]) : CARD_COLORS[0];
  selectedBg = card ? (card.bg || null) : null;
  $("#btnDelete").style.display = card ? "" : "none";
  buildColorRow();
  buildBgRow();

  $("#overlay").classList.add("open");
  setTimeout(() => $("#inpTitle").focus(), 50);
}

function closeModal() {
  $("#overlay").classList.remove("open");
  editing = null;
}

$("#btnCancel").addEventListener("click", closeModal);
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });

$("#btnSave").addEventListener("click", () => {
  if (!editing) return;
  const title = $("#inpTitle").value.trim();
  if (!title) { $("#inpTitle").focus(); return; }
  const desc = $("#inpDesc").value.trim();
  const col = project().columns.find((c) => c.id === editing.colId);

  if (editing.cardId) {
    const card = col.cards.find((c) => c.id === editing.cardId);
    Object.assign(card, { title, desc, color: selectedColor });
    if (selectedBg) card.bg = selectedBg; else delete card.bg;
  } else {
    const card = { id: uid(), title, desc, color: selectedColor };
    if (selectedBg) card.bg = selectedBg;
    if (isDoneColumn(col)) card.doneAt = new Date().toISOString();
    col.cards.push(card);
  }
  closeModal();
  scheduleSave(); render();
});

$("#btnDelete").addEventListener("click", () => {
  if (!editing || !editing.cardId) return;
  const col = project().columns.find((c) => c.id === editing.colId);
  col.cards = col.cards.filter((c) => c.id !== editing.cardId);
  closeModal();
  scheduleSave(); render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeModal(); closeDonePanel(); hideToast();
    $("#bgPopover").classList.remove("open");
  }
  if (e.key === "Enter" && e.target.id === "inpTitle") $("#btnSave").click();

  // jump around: Alt+1..9 boards, Alt+Shift+1..9 categories, Alt+arrows to step.
  // e.code is used rather than e.key because Alt+1 types "¡" on a Mac.
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || !data || !e.altKey) return;

  const digit = /^Digit([1-9])$/.exec(e.code);
  if (digit) {
    e.preventDefault();
    const n = Number(digit[1]) - 1;
    if (e.shiftKey) {
      const g = data.groups[n];
      if (g) switchGroup(g.id);
    } else {
      const p = groupProjects()[n];
      if (p) switchProject(p.id);
    }
    return;
  }
  if (e.key === "ArrowRight") { e.preventDefault(); stepProject(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stepProject(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); stepGroup(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); stepGroup(-1); }
});

/* ---------- global Done panel ---------- */

function collectDone() {
  // walk category by category so the panel mirrors the board hierarchy
  const ordered = [];
  for (const g of data.groups) {
    for (const p of data.projects.filter((x) => x.groupId === g.id)) ordered.push({ p, g });
  }
  for (const p of data.projects) {              // safety net for anything unfiled
    if (!ordered.some((o) => o.p.id === p.id)) ordered.push({ p, g: null });
  }
  return ordered.map(({ p, g }) => {
    const items = [];
    for (const col of p.columns) {
      if (!isDoneColumn(col)) continue;
      for (const card of col.cards) items.push({ card, colTitle: col.title });
    }
    // newest first; cards finished before dates were tracked sink to the bottom
    items.sort((a, b) => (b.card.doneAt || "").localeCompare(a.card.doneAt || ""));
    return { p, g, items, total: p.columns.reduce((n, c) => n + c.cards.length, 0) };
  });
}

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return `${days} days ago`;
  return d.toLocaleDateString();
}

function renderDonePanel() {
  const groups = collectDone();
  const done = groups.reduce((n, g) => n + g.items.length, 0);
  const everything = groups.reduce((n, g) => n + g.total, 0);

  $("#doneTotal").textContent = done;
  $("#doneSub").textContent =
    `across ${data.projects.length} board${data.projects.length === 1 ? "" : "s"} ` +
    `in ${data.groups.length} categor${data.groups.length === 1 ? "y" : "ies"}`;

  const now = Date.now();
  const within = (days) => groups.reduce((n, g) => n + g.items.filter((i) =>
    i.card.doneAt && now - new Date(i.card.doneAt).getTime() < days * 86400000).length, 0);
  const pct = everything ? Math.round((done / everything) * 100) : 0;
  $("#doneStats").innerHTML =
    `<div><b>${within(7)}</b>this week</div>` +
    `<div><b>${within(30)}</b>this month</div>` +
    `<div><b>${pct}%</b>of all tasks</div>`;

  const list = $("#doneList");
  list.innerHTML = "";
  if (!done) {
    list.innerHTML = `<div class="done-empty"><span class="big">🌱</span>
      Nothing completed yet.<br>Move a task into a Done column and it shows up here.</div>`;
  }
  for (const g of groups) {
    if (!g.items.length) continue;
    const sec = document.createElement("div");
    sec.className = "done-project";
    const share = g.total ? Math.round((g.items.length / g.total) * 100) : 0;
    sec.innerHTML = `
      <div class="done-project-head">
        <h3>${g.g ? `<span class="done-cat">${esc(g.g.name)}</span> ` : ""}${esc(g.p.name)}</h3>
        <span class="pill">${g.items.length} / ${g.total}</span>
        <div class="bar"><span style="width:${share}%"></span></div>
      </div>`;
    for (const it of g.items) {
      const row = document.createElement("div");
      row.className = "done-item";
      row.style.setProperty("--dot", it.card.color || "#10b981");
      row.innerHTML = `<span class="check">✔</span>
        <div class="txt">
          <div class="name">${esc(it.card.title)}</div>
          <div class="meta">${esc(it.colTitle)}</div>
        </div>
        <span class="when">${esc(fmtWhen(it.card.doneAt))}</span>`;
      sec.appendChild(row);
    }
    list.appendChild(sec);
  }

  const cfg = $("#doneConfigBody");
  cfg.innerHTML = "";
  for (const p of data.projects) {
    const box = document.createElement("div");
    box.className = "cfg-project";
    const h = document.createElement("h4");
    h.textContent = p.name;
    box.appendChild(h);
    for (const col of p.columns) {
      const row = document.createElement("label");
      row.className = "cfg-row";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isDoneColumn(col);
      cb.addEventListener("change", () => {
        col.done = cb.checked;   // explicit choice overrides name matching
        scheduleSave();
        renderDonePanel();
        render();
      });
      const name = document.createElement("span");
      name.textContent = col.title;
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = `${col.cards.length} task${col.cards.length === 1 ? "" : "s"}`;
      row.append(cb, name, n);
      box.appendChild(row);
    }
    cfg.appendChild(box);
  }
}

function openDonePanel() { renderDonePanel(); $("#doneOverlay").classList.add("open"); }
function closeDonePanel() { $("#doneOverlay").classList.remove("open"); }

$("#btnDone").addEventListener("click", openDonePanel);
$("#btnCloseDone").addEventListener("click", closeDonePanel);
$("#doneOverlay").addEventListener("click", (e) => {
  if (e.target.id === "doneOverlay") closeDonePanel();
});

/* ---------- version & updates ---------- */

let updateInfo = null;
const ver = (v) => (v ? `v${v}` : "v?");

function showToast({ icon = "⬆", title, body = "", note = "", log = "", actions = [] }) {
  $("#updateToast").classList.add("open");
  $("#updateToast .ut-badge").textContent = icon;
  $("#utTitle").textContent = title;
  $("#utBody").textContent = body;
  $("#utBody").style.display = body ? "" : "none";
  $("#utVer").textContent = note;
  $("#utVer").style.display = note ? "" : "none";
  $("#utLog").textContent = log;
  $("#utLog").style.display = log ? "" : "none";
  const act = $("#utActions");
  act.innerHTML = "";
  for (const a of actions) {
    const b = document.createElement("button");
    b.className = "btn " + (a.primary ? "btn-primary" : "btn-ghost");
    b.textContent = a.label;
    b.addEventListener("click", a.onClick);
    act.appendChild(b);
  }
}
function hideToast() { $("#updateToast").classList.remove("open"); }

async function checkUpdate(force) {
  const tag = $("#versionTag");
  if (force) tag.textContent = "checking…";
  try {
    updateInfo = await (await fetch("/api/update" + (force ? "?force=1" : ""))).json();
  } catch {
    tag.textContent = "v?";
    return;
  }
  tag.classList.toggle("has-update", !!updateInfo.updateAvailable);
  tag.textContent = updateInfo.updateAvailable
    ? `${ver(updateInfo.latest)} available`
    : ver(updateInfo.version);

  if (updateInfo.updateAvailable) {
    // don't nag about a version the user already chose to skip
    if (force || localStorage.getItem("kanbanSkippedVersion") !== updateInfo.latest) {
      showUpdateToast();
    }
  } else if (force) {
    showCheckResult();
  }
}

function showUpdateToast() {
  const i = updateInfo;
  const actions = [{ label: "Update now", primary: true, onClick: runUpdate }];
  actions.push({ label: "Later", onClick: () => {
    localStorage.setItem("kanbanSkippedVersion", i.latest);
    hideToast();
  }});
  showToast({
    title: `Version ${i.latest} is available`,
    body: i.notes || "",
    note: `You have ${ver(i.version)}${i.date ? " · released " + i.date : ""}`,
    actions,
  });
}

function showCheckResult() {
  if (updateInfo.offline) {
    showToast({
      icon: "📡",
      title: "Could not check for updates",
      body: "GitHub could not be reached. Check your internet connection and try again.",
      note: `Running ${ver(updateInfo.version)}`,
      actions: [{ label: "Close", onClick: hideToast }],
    });
  } else {
    showToast({
      icon: "✅",
      title: "You're up to date",
      note: `Running ${ver(updateInfo.version)} — the newest version on GitHub.`,
      actions: [{ label: "Close", onClick: hideToast }],
    });
  }
}

async function waitForServer(timeoutMs = 40000) {
  const started = Date.now();
  await new Promise((r) => setTimeout(r, 1500)); // give it time to go down first
  while (Date.now() - started < timeoutMs) {
    try {
      if ((await fetch("/api/board", { cache: "no-store" })).ok) return true;
    } catch { /* still restarting */ }
    await new Promise((r) => setTimeout(r, 700));
  }
  return false;
}

async function runUpdate() {
  showToast({ icon: "⏳", title: "Updating…", body: "Downloading the new version from GitHub." });
  let out;
  try {
    out = await (await fetch("/api/update", { method: "POST" })).json();
  } catch {
    showToast({ icon: "⚠️", title: "Update failed",
      body: "Could not reach the app — is it still running?",
      actions: [{ label: "Close", onClick: hideToast }] });
    return;
  }
  if (out.ok) {
    localStorage.removeItem("kanbanSkippedVersion");
    if (out.restarting) {
      showToast({
        icon: "♻️",
        title: "Installing and restarting…",
        body: "The app is restarting itself. This page reloads on its own in a few seconds.",
        log: out.output,
      });
      if (await waitForServer()) { location.reload(); return; }
      showToast({
        icon: "⚠️",
        title: "Installed, but the restart is taking long",
        body: "The new version is on disk. Start Kanban again to finish.",
        log: out.output,
        actions: [{ label: "Try reloading", primary: true, onClick: () => location.reload() }],
      });
      return;
    }
    showToast({
      icon: "✅",
      title: `Updated to ${ver(out.version)}`,
      body: "Restart the app to finish — close the terminal window, then start Kanban again.",
      log: out.output,
      actions: [
        { label: "Reload page", primary: true, onClick: () => location.reload() },
        { label: "Close", onClick: hideToast },
      ],
    });
  } else {
    showToast({
      icon: "⚠️",
      title: "Update could not be applied",
      body: "The new version could not be downloaded or written to disk. Your tasks are safe — an update never touches board.json.",
      log: out.output,
      actions: [
        { label: "Open GitHub", primary: true, onClick: () => window.open(updateInfo.repo, "_blank") },
        { label: "Close", onClick: hideToast },
      ],
    });
  }
}

$("#versionTag").addEventListener("click", () => checkUpdate(true));

loadData();
checkUpdate(false);
</script>
