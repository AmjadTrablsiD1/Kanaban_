<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kanaban Mind: a central idea, three branches, each ending in a status
       (to do / doing / done). Colours are the midnight theme's own tokens. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2450"/>
      <stop offset="1" stop-color="#090B19"/>
    </linearGradient>
    <linearGradient id="core" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#B15CFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8F7CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8F7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8F7CFF"/><stop offset="1" stop-color="#5FA8FF"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F7CFF"/><stop offset="1" stop-color="#F0A23C"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F7CFF"/><stop offset="1" stop-color="#38E0B0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#ground)"/>
  <circle cx="380" cy="512" r="330" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round" stroke-width="46">
    <path d="M450 452 C 560 380, 580 262, 700 262" stroke="url(#b1)"/>
    <path d="M500 512 L 690 512" stroke="url(#b2)"/>
    <path d="M450 572 C 560 644, 580 762, 700 762" stroke="url(#b3)"/>
  </g>
  <circle cx="760" cy="262" r="74" fill="#0E1128" stroke="#5FA8FF" stroke-width="38"/>
  <circle cx="760" cy="512" r="74" fill="#0E1128" stroke="#F0A23C" stroke-width="38"/>
  <path d="M760 468 A 44 44 0 0 1 760 556 Z" fill="#F0A23C"/>
  <circle cx="760" cy="762" r="92" fill="#38E0B0"/>
  <path d="M716 764 L 748 796 L 808 730" fill="none" stroke="#0E1128" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="512" r="158" fill="url(#core)"/>
  <circle cx="370" cy="512" r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="10"/>
</svg>
